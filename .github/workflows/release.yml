# Chafftafarian CI: tests, then the Linux AppImage. Tag pushes (v*) also
# publish a GitHub Release carrying the artifact. Device tests are
# fixture/fake-runner based by construction — CI never touches hardware.

name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run test suites
        working-directory: apps/desktop
        run: |
          uv sync --extra dev
          uv run pytest

  appimage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        run: packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chafftafarian-x86_64.AppImage
          path: packaging/chafftafarian-x86_64.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            packaging/chafftafarian-x86_64.AppImage --clobber
