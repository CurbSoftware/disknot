# Releases — tags only (v*), or dispatched by hand. Never fires on pushes
# to main, and never runs the test suite twice: it reuses the same steps
# ci.yml runs, because a release artifact must come from the same recipe.
#
# Publish: git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Test, build, and smoke the AppImage
        working-directory: apps/desktop
        run: |
          uv sync --extra dev
          uv run pytest
      - name: Build AppImage
        run: packaging/appimage.sh
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            packaging/chafftafarian-x86_64.AppImage --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: chafftafarian-x86_64.AppImage
          path: packaging/chafftafarian-x86_64.AppImage
          if-no-files-found: error
